[package]
name = "stanzaapi-pharma-dscsa"
version = "1.0.0"
edition = "2021"
authors = ["Stanza"]
description = "Official high-speed Rust client for FDA DSCSA & EU FMD Drug Serialization API"
license = "MIT"
readme = "README.md"
homepage = "https://stanzaapi.com/tools/pharma-dscsa"
repository = "https://github.com/StanzaAPI/pharma-dscsa-rust"
keywords = ["fda-dscsa","eu-fmd","serialization","epcis","pharma"]
categories = ["web-programming::http-client", "development-tools::ffi"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"], optional = true }
